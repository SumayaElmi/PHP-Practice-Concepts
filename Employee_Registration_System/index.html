
<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration System</title>
</head>
<body>

    <h2>Employee Registration Form</h2>

    <form action="process.php" method="POST"
          enctype="multipart/form-data">

        <!-- Employee Full Name -->
        <label>Employee Full Name:</label>
        <input type="text" name="employee_name">
        <br><br>

        <!-- Employee ID -->
        <label>Employee ID:</label>
        <input type="text" name="employee_id">
        <br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <!-- Department -->
        <label>Department:</label>
        <select name="department">
            <option value="">Select Department</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Administration">Administration</option>
        </select>
        <br><br>

        <!-- Basic Salary -->
        <label>Basic Salary:</label>
        <input type="number" name="basic_salary" step="any">
        <br><br>

        <!-- Allowance -->
        <label>Allowance:</label>
        <input type="number" name="allowance" step="any">
        <br><br>

        <!-- Deduction -->
        <label>Deduction:</label>
        <input type="number" name="deduction" step="any">
        <br><br>

        <!-- Employee Document -->
        <label>Employee Document:</label>
        <input type="file" name="employee_document">
        <br><br>

        <!-- Buttons -->
        <button type="submit">Register and Calculate</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
